<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOX · Tu Música</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{margin:0;background:#0b0b0f;color:#fff;padding-bottom:140px}
header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0b0b0f;z-index:10;border-bottom:1px solid #222}
header b{font-size:24px;letter-spacing:2px}
header b span{color:#a78bfa}
.btn{background:#a78bfa;color:#000;border:0;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.btn2{background:#1e1e28;color:#fff;border:1px solid #333;padding:9px 14px;border-radius:999px;cursor:pointer}
main{padding:20px;max-width:1100px;margin:auto}
h2{margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:#15151d;border:1px solid #262633;border-radius:16px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover;background:#222}
.card .info{padding:12px}
.card .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#aaa}
.badge{display:inline-block;background:#2a2140;color:#c4b5fd;font-size:11px;padding:3px 8px;border-radius:999px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.box{background:#17171f;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px;padding:20px}
input,textarea,select{width:100%;background:#0f0f15;border:1px solid #333;color:#fff;padding:11px;border-radius:10px;margin:8px 0}
textarea{min-height:90px}
.track{display:flex;align-items:center;gap:10px;background:#1c1c26;padding:10px;border-radius:12px;margin:8px 0}
.track button{margin-left:auto}
.track small{color:#aaa;display:block}
.player{position:fixed;left:0;right:0;bottom:0;background:#14141c;border-top:1px solid #333;padding:12px 16px;z-index:20}
.player .top{display:flex;gap:12px;align-items:center}
.player img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#222}
.player .flex{flex:1;min-width:0}
.player .flex b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px;align-items:center;margin-top:10px}
.controls button{background:#262633;color:#fff;border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px}
.controls button.play{background:#fff;color:#000;width:46px;height:46px;font-size:20px}
input[type=range]{flex:1;accent-color:#a78bfa}
.lyrics{position:fixed;right:16px;bottom:150px;width:340px;max-width:92vw;max-height:55vh;overflow:auto;background:#1a1a24;border:1px solid #444;border-radius:16px;padding:16px;display:none;z-index:30;white-space:pre-wrap}
.lyrics.open{display:block}
.lyrics h3{margin:0 0 8px}
@media(max-width:600px){.lyrics{left:16px;width:auto}}
</style>
</head>
<body>
<header><b>BOX<span>·</span></b><button class="btn" onclick="openModal()">+ Nuevo Álbum</button></header>
<main>
<h2>Tu Biblioteca</h2>
<div id="library" class="grid"></div>
<p id="empty" style="color:#888">Aún no tienes álbumes. Crea uno para subir tu música WAV o MP3.</p>
<h2>Todos los temas</h2>
<div id="allTracks"></div>
</main>

<div id="modal" class="modal"><div class="box">
<h2 style="margin:0">Nuevo Álbum</h2>
<label>Nombre del álbum</label><input id="albumName" placeholder="Ej: Mi primer EP">
<label>Artista</label><input id="albumArtist" placeholder="Ej: Tu nombre">
<label>Portada</label><input type="file" id="coverInput" accept="image/*">
<label>Canciones (MP3, WAV, FLAC, OGG, M4A)</label>
<input type="file" id="songsInput" multiple accept="audio/*,.mp3,.wav,.wave,.flac,.ogg,.m4a">
<label>Letra de la primera canción (opcional)</label>
<textarea id="firstLyrics" placeholder="Pega aquí la letra..."></textarea>
<label>O sube la letra en .txt</label><input type="file" id="lyricsFile" accept=".txt,text/plain">
<div style="display:flex;gap:10px"><button class="btn" id="saveBtn" onclick="createAlbum()">Guardar Álbum</button><button class="btn2" onclick="closeModal()">Cancelar</button></div>
<p id="createMsg" style="color:#a78bfa"></p>
</div></div>

<div id="albumView" class="modal"><div class="box">
<button class="btn2" onclick="closeAlbum()">← Volver</button>
<h2 id="viewTitle"></h2><p id="viewArtist" style="color:#aaa"></p>
<img id="viewCover" style="width:100%;height:220px;object-fit:cover;border-radius:14px">
<div id="viewTracks"></div>
</div></div>

<div class="player">
<div class="top">
<img id="pCover"><div class="flex"><b id="pTitle">Sin reproducción</b><small id="pArtist" style="color:#aaa">Elige una canción</small></div>
<button class="btn2" onclick="toggleLyrics()">♪ Letra</button>
</div>
<div class="controls">
<button onclick="prevTrack()">⏮</button>
<button class="play" id="playBtn" onclick="togglePlay()">▶</button>
<button onclick="nextTrack()">⏭</button>
<span id="curTime">0:00</span><input type="range" id="seek" value="0" min="0" max="100" oninput="seekTo(this.value)"><span id="durTime">0:00</span>
</div>
<audio id="audio" ontimeupdate="updateTime()" onended="nextTrack()"></audio>
</div>

<div id="lyricsPanel" class="lyrics">
<h3>♪ Letra</h3><b id="lyTitle"></b><p id="lyText" style="color:#ddd"></p>
<textarea id="lyEdit" style="display:none"></textarea>
<button class="btn" id="lyBtn" onclick="editLyrics()">Editar letra</button>
<button class="btn2" onclick="toggleLyrics()">Cerrar</button>
</div>

<script>
let albums = JSON.parse(localStorage.getItem('box_albums_v2')||'[]');
let queue=[], qIndex=0, currentAlbumId=null, currentTrackIndex=0;
const audio=document.getElementById('audio');

// --- IndexedDB para WAV grandes ---
let dbPromise = new Promise((res,rej)=>{
  let req = indexedDB.open('box_music_db',1);
  req.onupgradeneeded = ()=>{ req.result.createObjectStore('files'); };
  req.onsuccess = ()=>res(req.result);
  req.onerror = ()=>rej(req.error);
});
async function idbPut(key, blob){ let db=await dbPromise; return new Promise((res,rej)=>{ let tx=db.transaction('files','readwrite'); tx.objectStore('files').put(blob,key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function idbGet(key){ let db=await dbPromise; return new Promise((res,rej)=>{ let tx=db.transaction('files','readonly'); let r=tx.objectStore('files').get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function getFileUrl(key){
  if(!key) return '';
  if(key.startsWith('blob:')||key.startsWith('data:')) return key;
  let blob = await idbGet(key);
  if(!blob) return '';
  return URL.createObjectURL(blob);
}

function saveMeta(){ localStorage.setItem('box_albums_v2', JSON.stringify(albums)); render(); }
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function closeAlbum(){document.getElementById('albumView').classList.remove('open')}
function fmt(s){if(!s||isNaN(s))return '0:00';let m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+String(ss).padStart(2,'0')}

async function createAlbum(){
  let btn=document.getElementById('saveBtn');
  let msg=document.getElementById('createMsg');
  try{
    btn.disabled=true; btn.textContent='Guardando...'; msg.textContent='Guardando en IndexedDB, espera... no cierres';
    let name=document.getElementById('albumName').value.trim()||'Sin título';
    let artist=document.getElementById('albumArtist').value.trim()||'Artista desconocido';
    let coverFile=document.getElementById('coverInput').files[0];
    let albumId=Date.now();
    let coverKey='';
    if(coverFile){ coverKey='cover_'+albumId; await idbPut(coverKey, coverFile); }
    let files=[...document.getElementById('songsInput').files];
    if(!files.length){msg.textContent='Elige al menos 1 canción'; btn.disabled=false; btn.textContent='Guardar Álbum'; return}
    let firstLyrics=document.getElementById('firstLyrics').value;
    let lf=document.getElementById('lyricsFile').files[0];
    if(lf){ firstLyrics=await lf.text() }
    let tracks=[];
    for(let i=0;i<files.length;i++){
      let f=files[i];
      let key='track_'+albumId+'_'+i+'_'+Date.now();
      await idbPut(key, f);
      let ext=(f.name.split('.').pop()||'').toUpperCase();
      tracks.push({name:f.name.replace(/\.[^/.]+$/,''), fileName:f.name, type:ext, key, lyrics: i===0?firstLyrics:''});
    }
    albums.unshift({id:albumId, name, artist, coverKey, tracks});
    saveMeta(); closeModal();
    document.getElementById('albumName').value='';document.getElementById('albumArtist').value='';document.getElementById('firstLyrics').value='';
    document.getElementById('songsInput').value='';document.getElementById('coverInput').value='';document.getElementById('lyricsFile').value='';
    alert('Álbum creado con '+tracks.length+' canciones');
  }catch(e){
    console.error(e); alert('Error al guardar: '+e.message+' - Prueba con un archivo más pequeño o en Chrome');
  } finally { btn.disabled=false; btn.textContent='Guardar Álbum'; msg.textContent=''; }
}
async function render(){
  let lib=document.getElementById('library'); lib.innerHTML='';
  document.getElementById('empty').style.display=albums.length?'none':'block';
  for(let a of albums){
    let coverUrl = a.coverKey ? await getFileUrl(a.coverKey) : '';
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img src="${coverUrl}"><div class="info"><b>${a.name}</b><small>${a.artist} · ${a.tracks.length} temas</small><br>${a.tracks.some(t=>t.type==='WAV'||t.type==='WAVE')?'<span class="badge">WAV ✓</span>':''} ${a.tracks.some(t=>t.lyrics)?'<span class="badge">Con letra ♪</span>':''}</div>`;
    d.onclick=()=>openAlbum(a.id); lib.appendChild(d);
  }
  let all=document.getElementById('allTracks'); all.innerHTML='';
  albums.forEach(a=>a.tracks.forEach((t,ti)=>{
    let div=document.createElement('div'); div.className='track';
    div.innerHTML=`<div><b>${t.name}</b><small>${a.name} · ${a.artist} · ${t.type} ${t.lyrics?'· ♪ Tiene letra':''}</small></div><button class="btn2" onclick="playFrom(${a.id},${ti})">▶</button>`;
    all.appendChild(div);
  }));
}
async function openAlbum(id){
  let a=albums.find(x=>x.id===id); if(!a)return; currentAlbumId=id;
  document.getElementById('viewTitle').textContent=a.name;
  document.getElementById('viewArtist').textContent=a.artist;
  document.getElementById('viewCover').src = a.coverKey ? await getFileUrl(a.coverKey) : '';
  let box=document.getElementById('viewTracks'); box.innerHTML='';
  a.tracks.forEach((t,ti)=>{
    let div=document.createElement('div'); div.className='track';
    div.innerHTML=`<div><b>${t.name}</b><small>${t.fileName} · ${t.type} ${t.lyrics?'· ♪ Tiene letra':''}</small></div>
    <button class="btn2" onclick="editTrackLyrics(${id},${ti})">✏️ Letra</button>
    <button class="btn2" onclick="playFrom(${id},${ti})">▶</button>`;
    box.appendChild(div);
  });
  document.getElementById('albumView').classList.add('open');
}
function playFrom(albumId, trackIdx){
  let a=albums.find(x=>x.id===albumId); if(!a)return;
  queue=a.tracks; qIndex=trackIdx; currentAlbumId=albumId; currentTrackIndex=trackIdx;
  loadCurrent(); closeAlbum();
}
async function loadCurrent(){
  let a=albums.find(x=>x.id===currentAlbumId); if(!a)return;
  let t=a.tracks[currentTrackIndex];
  let url = await getFileUrl(t.key);
  if(!url){ alert('No se encontró el audio. Vuelve a subirlo.'); return; }
  audio.src=url; audio.play();
  document.getElementById('playBtn').textContent='⏸';
  document.getElementById('pTitle').textContent=t.name;
  document.getElementById('pArtist').textContent=a.artist+' · '+a.name+' · '+t.type;
  document.getElementById('pCover').src = a.coverKey ? await getFileUrl(a.coverKey) : '';
  document.getElementById('lyTitle').textContent=t.name;
  document.getElementById('lyText').textContent=t.lyrics||'Esta canción aún no tiene letra. Dale a Editar letra para agregarla.';
  document.getElementById('lyEdit').value=t.lyrics||'';
}
function togglePlay(){if(audio.paused){audio.play();document.getElementById('playBtn').textContent='⏸'}else{audio.pause();document.getElementById('playBtn').textContent='▶'}}
function nextTrack(){if(!queue.length)return; currentTrackIndex=(currentTrackIndex+1)%queue.length; loadCurrent();}
function prevTrack(){if(!queue.length)return; currentTrackIndex=(currentTrackIndex-1+queue.length)%queue.length; loadCurrent();}
function updateTime(){document.getElementById('curTime').textContent=fmt(audio.currentTime);document.getElementById('durTime').textContent=fmt(audio.duration);if(audio.duration)document.getElementById('seek').value=(audio.currentTime/audio.duration)*100}
function seekTo(v){if(audio.duration)audio.currentTime=(v/100)*audio.duration}
function toggleLyrics(){document.getElementById('lyricsPanel').classList.toggle('open')}
function editLyrics(){
  let btn=document.getElementById('lyBtn'); let edit=document.getElementById('lyEdit'); let text=document.getElementById('lyText');
  if(edit.style.display==='none'){edit.style.display='block'; text.style.display='none'; btn.textContent='Guardar letra';}
  else{
    let a=albums.find(x=>x.id===currentAlbumId); if(!a){alert('Primero reproduce una canción');return}
    a.tracks[currentTrackIndex].lyrics=edit.value; saveMeta();
    text.textContent=edit.value||'Sin letra'; edit.style.display='none'; text.style.display='block'; btn.textContent='Editar letra';
    alert('Letra guardada ✓'); render();
  }
}
function editTrackLyrics(albumId, trackIdx){
  let newLy=prompt('Pega la letra para esta canción:', albums.find(x=>x.id===albumId).tracks[trackIdx].lyrics||'');
  if(newLy!==null){albums.find(x=>x.id===albumId).tracks[trackIdx].lyrics=newLy; saveMeta(); openAlbum(albumId); alert('Letra guardada ✓')}
}
render();
</script>
</body>
</html>
